name: Publish Release to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to notify (e.g. v0.0.13)'
        required: true
        default: v0.0.13

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send release note and assets to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release view "${{ inputs.tag }}" --json name,body,url,assets \
              > /tmp/release.json
            export RELEASE_JSON=/tmp/release.json
          fi
          python3 Scripts/telegram_release_notify.py
